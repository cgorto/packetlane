[package]
name = "packetlane"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only checker and timeline for CCSDS space packet logs gathered from several hosts"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
regex = "1.13.2"
rusqlite = { version = "0.43", features = ["bundled", "limits", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
